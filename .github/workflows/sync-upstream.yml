name: Sync fork with upstream

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    # Only run on the fork, never on the upstream repo itself.
    if: github.repository != 'demisto/content'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/demisto/content.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Merge upstream/master into master
        run: |
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with upstream/master."
            exit 0
          fi
          git merge --no-edit upstream/master
          git push origin master
